<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un mazzo di fiori per te 💐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #3a1f4d 0%, #1a0f26 55%, #0b0612 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
    color: #fff;
  }
  .stage { position: relative; width: min(92vw, 460px); aspect-ratio: 400 / 520; }
  svg { width: 100%; height: 100%; overflow: visible; }

  /* Steli che crescono */
  .stem {
    fill: none; stroke: #3f8f4a; stroke-width: 4; stroke-linecap: round;
    stroke-dasharray: 400; stroke-dashoffset: 400;
    animation: grow 1.8s ease-out forwards;
  }
  @keyframes grow { to { stroke-dashoffset: 0; } }

  /* Foglie */
  .leaf {
    fill: #4fa65a; transform-box: fill-box; transform-origin: 0% 50%;
    transform: scale(0); animation: pop 0.8s cubic-bezier(.3,1.6,.5,1) forwards;
  }

  /* Fiori che sbocciano + leggero ondeggiare */
  .flower { transform-box: fill-box; transform-origin: center; transform: scale(0);
    animation: bloom 1.1s cubic-bezier(.3,1.5,.5,1) forwards, sway 4s ease-in-out infinite alternate; }
  @keyframes bloom { to { transform: scale(1); } }
  @keyframes pop { to { transform: scale(1); } }
  @keyframes sway { from { rotate: -4deg; } to { rotate: 4deg; } }

  .center { animation: glow 2.5s ease-in-out infinite alternate; }
  @keyframes glow { from { filter: brightness(1); } to { filter: brightness(1.35); } }

  /* Carta e fiocco */
  .wrap { opacity: 0; animation: fadeUp 1s ease-out 0.2s forwards; }
  .bow { opacity: 0; transform-box: fill-box; transform-origin: center;
    animation: fadeUp 0.8s ease-out 3.6s forwards, bowPulse 2s ease-in-out 4.4s infinite; }
  @keyframes fadeUp { from { opacity: 0; translate: 0 20px; } to { opacity: 1; translate: 0 0; } }
  @keyframes bowPulse { 50% { scale: 1.06; } }

  /* Messaggio */
  .msg {
    margin-top: 6px; font-size: clamp(22px, 6vw, 34px); font-style: italic;
    letter-spacing: 1px; text-align: center; opacity: 0;
    text-shadow: 0 0 18px rgba(255,140,190,.7);
    animation: fadeUp 1.4s ease-out 4.2s forwards;
  }
  .sub { font-size: clamp(14px, 3.8vw, 18px); opacity: 0; margin-top: 6px; color: #f6c7dc;
    animation: fadeUp 1.4s ease-out 5s forwards; }

  /* Petali che cadono */
  .petal {
    position: fixed; top: -30px; width: 14px; height: 10px; border-radius: 80% 0 80% 0;
    opacity: .85; pointer-events: none; animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translate(0,0) rotate(0deg); }
    100% { transform: translate(var(--dx), 110vh) rotate(720deg); }
  }

  /* Stelline sullo sfondo */
  .star { position: fixed; width: 2px; height: 2px; background: #fff; border-radius: 50%;
    animation: twinkle ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .1; } to { opacity: .9; } }
</style>
</head>
<body>

<div class="stage">
  <svg id="bouquet" viewBox="0 0 400 520"></svg>
</div>
<div class="msg">Sei la mia vita, ti amo ❤️</div>
<div class="sub">tocca lo schermo per altri petali</div>

<script>
  const svg = document.getElementById('bouquet');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };

  // Punto in cui si raccolgono gli steli (dentro la carta)
  const BASE = { x: 200, y: 420 };

  // Fiori: posizione, tipo, colore, ritardo
  const flowers = [
    { x: 200, y: 105, type: 'rose',  c: '#ff4d7d', d: 1.6 },
    { x: 120, y: 150, type: 'daisy', c: '#ffffff', d: 1.9 },
    { x: 282, y: 145, type: 'tulip', c: '#ff8fb8', d: 2.0 },
    { x: 155, y: 205, type: 'rose',  c: '#ff7aa2', d: 2.3 },
    { x: 250, y: 200, type: 'daisy', c: '#ffd1e3', d: 2.4 },
    { x: 85,  y: 225, type: 'tulip', c: '#c86bff', d: 2.6 },
    { x: 318, y: 225, type: 'rose',  c: '#ff3366', d: 2.7 },
    { x: 205, y: 250, type: 'daisy', c: '#fff4b0', d: 2.9 },
    { x: 125, y: 95,  type: 'bud',   c: '#ffb3cc', d: 3.0 },
    { x: 280, y: 85,  type: 'bud',   c: '#e3a1ff', d: 3.1 },
  ];

  // Steli e foglie
  const stems = el('g', {});
  flowers.forEach((f, i) => {
    const cx = (f.x + BASE.x) / 2 + (f.x < BASE.x ? -25 : 25);
    const cy = (f.y + BASE.y) / 2;
    const p = el('path', { class: 'stem', d: `M${BASE.x + (i - 5) * 2},${BASE.y} Q${cx},${cy} ${f.x},${f.y}` }, stems);
    p.style.animationDelay = (0.3 + i * 0.08) + 's';

    // una foglia a metà stelo
    const lx = (BASE.x + f.x) / 2 + (f.x < BASE.x ? -12 : 12);
    const ly = (BASE.y + f.y) / 2 + 20;
    const dir = f.x < BASE.x ? -1 : 1;
    const leaf = el('path', {
      class: 'leaf',
      d: `M${lx},${ly} q${18*dir},-16 ${34*dir},-4 q${-14*dir},14 ${-34*dir},4z`
    }, stems);
    leaf.style.animationDelay = (1.2 + i * 0.1) + 's';
  });

  // Carta del bouquet
  const wrap = el('g', { class: 'wrap' });
  el('path', { d: 'M110,300 L200,500 L290,300 Q200,330 110,300Z', fill: '#f7d9e3' }, wrap);
  el('path', { d: 'M110,300 L200,500 L160,310Z', fill: '#efc2d3' }, wrap);
  el('path', { d: 'M290,300 L200,500 L240,310Z', fill: '#e9b2c7' }, wrap);
  el('path', { d: 'M110,300 Q200,330 290,300', fill: 'none', stroke: '#d993b0', 'stroke-width': 2 }, wrap);

  // Fiori
  function petalRing(g, n, rx, ry, dist, color, rotOffset = 0, opacity = 1) {
    for (let k = 0; k < n; k++) {
      const a = (360 / n) * k + rotOffset;
      el('ellipse', { cx: 0, cy: -dist, rx, ry, fill: color, opacity,
        transform: `rotate(${a})` }, g);
    }
  }

  flowers.forEach(f => {
    const outer = el('g', { transform: `translate(${f.x},${f.y})` });
    const g = el('g', { class: 'flower' }, outer);
    g.style.animationDelay = `${f.d}s, ${f.d + 1.1}s`;

    if (f.type === 'rose') {
      petalRing(g, 6, 14, 18, 12, f.c, 0, .9);
      petalRing(g, 5, 10, 13, 7, shade(f.c, -20), 30);
      el('circle', { r: 8, fill: shade(f.c, -40), class: 'center' }, g);
      el('path', { d: 'M-4,0 a4,4 0 1,1 8,0 a3,3 0 1,1 -5,1', fill: 'none',
        stroke: shade(f.c, 25), 'stroke-width': 1.5 }, g);
    } else if (f.type === 'daisy') {
      petalRing(g, 12, 5, 14, 14, f.c);
      el('circle', { r: 9, fill: '#ffc93c', class: 'center' }, g);
    } else if (f.type === 'tulip') {
      el('path', { d: 'M-16,-4 Q-18,-30 -8,-26 L0,-14 L8,-26 Q18,-30 16,-4 Q0,14 -16,-4Z', fill: f.c }, g);
      el('path', { d: 'M-6,-6 Q0,-34 6,-6 Q0,6 -6,-6Z', fill: shade(f.c, -25) }, g);
    } else { // bocciolo
      el('ellipse', { cx: 0, cy: -6, rx: 8, ry: 12, fill: f.c }, g);
      el('path', { d: 'M-8,0 Q0,-6 8,0 Q0,8 -8,0Z', fill: '#4fa65a' }, g);
    }
  });

  // Fiocco
  const bow = el('g', { class: 'bow' });
  el('path', { d: 'M200,365 Q160,335 165,375 Q175,390 200,370Z', fill: '#e2245b' }, bow);
  el('path', { d: 'M200,365 Q240,335 235,375 Q225,390 200,370Z', fill: '#e2245b' }, bow);
  el('path', { d: 'M196,372 L180,415 L190,410 L198,418Z', fill: '#c91a4c' }, bow);
  el('path', { d: 'M204,372 L220,415 L210,410 L202,418Z', fill: '#c91a4c' }, bow);
  el('circle', { cx: 200, cy: 368, r: 7, fill: '#ff3d6e' }, bow);

  // Schiarisce/scurisce un colore hex
  function shade(hex, pct) {
    const n = parseInt(hex.slice(1), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(v + (pct / 100) * 255)));
    return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)]
      .map(v => v.toString(16).padStart(2, '0')).join('');
  }

  // Stelline
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = (1.5 + Math.random() * 3) + 's';
    s.style.animationDelay = Math.random() * 3 + 's';
    document.body.appendChild(s);
  }

  // Petali che cadono
  const petalColors = ['#ff7aa2', '#ffb3cc', '#ff4d7d', '#e3a1ff', '#ffd1e3'];
  function dropPetal(x) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (x ?? Math.random() * window.innerWidth) + 'px';
    p.style.background = petalColors[Math.floor(Math.random() * petalColors.length)];
    p.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
    p.style.animationDuration = (5 + Math.random() * 5) + 's';
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
  setTimeout(() => setInterval(() => dropPetal(), 450), 3500);

  // Tocco = pioggia di petali
  document.addEventListener('pointerdown', e => {
    for (let i = 0; i < 12; i++) setTimeout(() => dropPetal(e.clientX + (Math.random() * 80 - 40)), i * 60);
  });
</script>
</body>
</html>
